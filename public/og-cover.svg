<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.7">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#1c2026" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <g transform="translate(96, 96)">
    <rect width="64" height="64" rx="14" fill="#22c55e"/>
    <path d="M20 20h24l-18 24h18" stroke="#0a0b0d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="180" y="143" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#e7e9ec" letter-spacing="-0.5">Zeno</text>

  <text x="96" y="290" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="600" fill="#e7e9ec" letter-spacing="-2.5">Stablecoin payroll</text>
  <text x="96" y="378" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="600" letter-spacing="-2.5">
    <tspan fill="#e7e9ec">for </tspan><tspan fill="#3bd77a">global teams.</tspan>
  </text>

  <text x="96" y="442" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#9aa0a8" font-weight="400">Pay contractors in under 3 minutes at 0.2% — versus 2–7% and 3–5 days with SWIFT.</text>

  <g transform="translate(96, 502)" font-family="ui-monospace, SFMono-Regular, monospace">
    <g>
      <text x="0" y="32" font-size="34" font-weight="600" fill="#3bd77a">0.2%</text>
      <text x="0" y="62" font-size="16" fill="#9aa0a8">Network fee</text>
    </g>
    <g transform="translate(220, 0)">
      <text x="0" y="32" font-size="34" font-weight="600" fill="#3bd77a">&lt; 3 min</text>
      <text x="0" y="62" font-size="16" fill="#9aa0a8">Settlement</text>
    </g>
    <g transform="translate(440, 0)">
      <text x="0" y="32" font-size="34" font-weight="600" fill="#3bd77a">4.5%</text>
      <text x="0" y="62" font-size="16" fill="#9aa0a8">Treasury APY</text>
    </g>
  </g>

  <g transform="translate(960, 480)" opacity="0.85">
    <rect x="0" y="0" width="160" height="60" rx="10" fill="none" stroke="#22c55e" stroke-opacity="0.4"/>
